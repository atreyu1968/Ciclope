name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: npm install
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npx prisma validate --config prisma7.config.ts
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Seed integration database
        run: npm run db:seed
      - name: Unit and authorization tests
        run: npm run test:unit
      - name: PostgreSQL integration tests
        run: npm run test:integration
      - name: Create isolated E2E database
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: 'postgresql://ci:ci@127.0.0.1:5432/postgres' });
            await client.connect();
            await client.query('DROP DATABASE IF EXISTS ci_e2e');
            await client.query('CREATE DATABASE ci_e2e');
            await client.end();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Prepare E2E database
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_e2e
        run: |
          npm run db:migrate
          npm run db:seed
      - name: Core HTTP E2E flow
        env:
          E2E_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_e2e
        run: npm run test:e2e
      - name: Build
        run: npm run build
